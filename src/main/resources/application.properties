spring.application.name=News-Blog
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.thymeleaf.check-template-location=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=32KB
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=news-blog
security.jwt.audience=news-blog-api
security.jwt.access-ttl=15m
security.bootstrap.username=${ADMIN_USERNAME:}
security.bootstrap.email=${ADMIN_EMAIL:}
security.bootstrap.password=${ADMIN_PASSWORD:}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3:4b-instruct}
ai.ollama.connect-timeout=5s
ai.ollama.read-timeout=180s
ai.ollama.health-timeout=5s
