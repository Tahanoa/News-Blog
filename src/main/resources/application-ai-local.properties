# Local API test mode: no database or templates are needed.
server.address=127.0.0.1
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
spring.security.user.name=${AI_TEST_USER:ai-test}
spring.security.user.password=${AI_TEST_PASSWORD:local-test}
spring.security.user.roles=ADMIN
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:qwen3:4b-instruct}
ai.ollama.connect-timeout=5s
ai.ollama.read-timeout=180s
ai.ollama.health-timeout=5s
