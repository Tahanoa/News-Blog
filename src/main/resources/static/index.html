<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News Blog</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header>
  <a href="/" data-route class="brand">News Blog</a>
  <nav aria-label="Main navigation">
    <a href="/" data-route>News</a>
    <a href="/reporter" data-route id="reporter-link" hidden>Reporter panel</a>
    <a href="/admin" data-route id="admin-link" hidden>Admin panel</a>
    <a href="/login" data-route id="login-link">Log in</a>
    <a href="/register" data-route id="register-link">Sign up</a>
    <button type="button" id="logout" hidden>Log out</button>
  </nav>
  <p id="identity"></p>
</header>
<main>
  <p id="message" role="status" aria-live="polite" hidden></p>
  <section id="page" aria-live="polite"><p>Loading...</p></section>
  <noscript>Enable JavaScript to use the news and account pages.</noscript>
</main>
<footer>Initial prototype. News, comments and image requests use Bearer JWT authentication.</footer>
</body>
</html>
