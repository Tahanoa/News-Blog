<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود و ثبت‌نام | خبرنامه</title>
    <link rel="stylesheet" href="/auth.css">
    <script src="/auth.js" defer></script>
</head>
<body>
<main class="card">
    <p class="brand">خبرنامه</p>
    <h1 id="title">ورود به حساب</h1>
    <p id="intro">برای دسترسی به حساب خود وارد شوید.</p>
    <div class="tabs" id="tabs">
        <button type="button" id="login-tab" aria-pressed="true">ورود</button>
        <button type="button" id="register-tab" aria-pressed="false">ثبت‌نام</button>
    </div>
    <form id="auth-form">
        <label for="username">نام کاربری</label>
        <input id="username" name="username" dir="ltr" required minlength="3" maxlength="40"
               pattern="[a-zA-Z0-9_.-]{3,40}" autocomplete="username">
        <small>۳ تا ۴۰ حرف انگلیسی، عدد، نقطه، خط تیره یا زیرخط</small>
        <div id="email-field" hidden>
            <label for="email">ایمیل</label>
            <input id="email" name="email" type="email" dir="ltr" maxlength="254" autocomplete="email">
        </div>
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" dir="ltr" required maxlength="72" autocomplete="current-password">
        <small id="password-help" hidden>حداقل ۱۲ نویسه؛ حداکثر ۷۲ بایت UTF-8</small>
        <button id="submit" class="primary" type="submit">ورود</button>
    </form>
    <section id="account" hidden>
        <h2>حساب شما</h2>
        <dl>
            <dt>نام کاربری</dt><dd id="account-username"></dd>
            <dt>ایمیل</dt><dd id="account-email" dir="ltr"></dd>
            <dt>نقش</dt><dd id="account-role"></dd>
            <dt>وضعیت</dt><dd id="account-enabled"></dd>
        </dl>
        <button id="logout" type="button" class="primary">خروج از همه نشست‌ها</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
</main>
</body>
</html>
